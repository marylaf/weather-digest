services:
  weather-digest:
    build: .
    image: weather-digest:local
    command: ['node', 'dist/index.js']
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports

  api:
    build: .
    image: weather-digest:local
    command: ['node', 'dist/api/server.js']
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    env_file:
      - .env
    environment:
      EQUIPMENT_FILE: /app/data/equipment.json
      REQUESTS_FILE: /app/data/requests.json
      # В сети Compose Postgres слушает 5432. DB_PORT из .env — порт на хосте.
      DB_HOST: postgres
      DB_PORT: '5432'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./public:/app/public

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
